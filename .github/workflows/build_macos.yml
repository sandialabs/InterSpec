name: Build macOS App

on:
  workflow_call:
    secrets:
      LEAFLET_KEY:
        required: true
      MAC_SIGNING_CERT_P12:
        required: true
      MAC_SIGNING_CERT_PASSWORD:
        required: true
      MAC_SIGNING_IDENTITY:
        required: true
      MAC_NOTARY_TEAM_ID:
        required: true
      MAC_NOTARY_KEY_ID:
        required: true
      MAC_NOTARY_KEY_ISSUER:
        required: true
      MAC_NOTARY_KEY_CONTENTS:
        required: true

concurrency: ci-macos-${{ github.ref }}

jobs:
  macos-build:
    runs-on: macos-26
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    env:
      NOTARY_PROFILE: interspec-notary-${{ github.run_id }}-${{ github.run_attempt }}
      MAC_DEVELOPER_TEAM_ID: ${{ secrets.MAC_NOTARY_TEAM_ID }}
      MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Define build paths
        run: |
          echo "BUILD_DIR=${RUNNER_TEMP}/build_macos" >> "${GITHUB_ENV}"
          echo "INSTALLER_DIR=${RUNNER_TEMP}/mac_artifacts" >> "${GITHUB_ENV}"
          # This basename is what the user sees inside the mounted .dmg, so keep it in step with
          # the .dmg name below.  The name is the warning - this branch is not the stable build.
          echo "PAYLOAD_DIR=${RUNNER_TEMP}/mac_artifacts/InterSpec_macOS_Dangerously_Experimental" >> "${GITHUB_ENV}"

      - name: Prepare directories
        run: |
          mkdir -p "${BUILD_DIR}" "${INSTALLER_DIR}"

      # The dependency prefix lives in a composite action rather than inline here so that this
      # workflow and the stdio MCP server's (build_mcp_stdio.yml) compute the SAME cache key by
      # construction, and so share one prefix.
      - name: Build or restore the dependency prefix
        id: deps
        uses: ./.github/actions/macos_deps_prefix

      # A compiler cache.  The Xcode generator does not support CMake's <LANG>_COMPILER_LAUNCHER (only
      # the Makefile, Ninja and VS generators do), so Xcode's CC/CXX are pointed at wrappers that run
      # the real clang through ccache.  ccache-action restores the newest `ccache-wt4-macos-app-*`
      # entry, and writes cache_dir, max_size and compiler_check=content into ccache's config file -
      # which the wrappers read even if Xcode does not pass the job environment on to the compiler.
      # Pinned by commit; `install: binary` installs its own sha256-checked ccache (4.13.6) rather
      # than Homebrew's newest.
      #  - Before the signing setup, so this third-party code never runs while the Developer ID
      #    keychain is unlocked (its post step, which saves the cache, runs after the cleanup).
      #  - An optimization only: if it fails (e.g. the download), build without it.
      #  - No `evict-old-files`: its eviction also runs after a failed build, which would save a cache
      #    holding only what was compiled before the failure.  max-size bounds it instead.
      - name: ccache
        id: ccache
        continue-on-error: true
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: wt4-macos-app
          # Xcode compiles each architecture separately, so a universal build is two objects per source.
          max-size: 2G
          install: binary

      - name: Point Xcode at ccache
        if: steps.ccache.outcome == 'success'
        run: |
          set -euo pipefail
          # ccache's documented settings for Xcode: it passes -index-store-path (also turned off at
          #  configure, below) and, for some targets, -ivfsoverlay.
          ccache --set-config=sloppiness=clang_index_store,ivfsoverlay
          WRAP_DIR="${RUNNER_TEMP}/ccache_xcode"
          mkdir -p "${WRAP_DIR}"
          CCACHE_BIN=$(command -v ccache)
          for tool in clang clang++; do
            printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' "${CCACHE_BIN}" "$(xcrun -f "${tool}")" > "${WRAP_DIR}/${tool}"
            chmod +x "${WRAP_DIR}/${tool}"
          done
          cat "${WRAP_DIR}/clang"
          echo "CCACHE_WRAP_DIR=${WRAP_DIR}" >> "${GITHUB_ENV}"
          ccache --zero-stats
          ccache --show-config | grep -E "cache_dir|max_size|compiler_check|sloppiness"

      - name: Set up code signing and notarization credentials
        uses: ./.github/actions/macos_signing_setup
        with:
          signing-cert-p12: ${{ secrets.MAC_SIGNING_CERT_P12 }}
          signing-cert-password: ${{ secrets.MAC_SIGNING_CERT_PASSWORD }}
          notary-key-contents: ${{ secrets.MAC_NOTARY_KEY_CONTENTS }}

      # The CMAKE_XCODE_ATTRIBUTE_* lines are for ccache: CC/CXX are the wrappers, linking uses the
      # real clang, and the index store (an IDE feature) and clang modules (no source uses @import)
      # are off, as both put per-build paths into the compile command.
      - name: Configure InterSpec (Xcode)
        env:
          LEAFLET_KEY: ${{ secrets.LEAFLET_KEY }}
        run: |
          set -euo pipefail
          CCACHE_ARGS=()
          if [ -n "${CCACHE_WRAP_DIR:-}" ]; then
            CCACHE_ARGS=( -DCMAKE_XCODE_ATTRIBUTE_CC="${CCACHE_WRAP_DIR}/clang"
                          -DCMAKE_XCODE_ATTRIBUTE_CXX="${CCACHE_WRAP_DIR}/clang++"
                          -DCMAKE_XCODE_ATTRIBUTE_LD="$(xcrun -f clang)"
                          -DCMAKE_XCODE_ATTRIBUTE_LDPLUSPLUS="$(xcrun -f clang++)"
                          -DCMAKE_XCODE_ATTRIBUTE_COMPILER_INDEX_STORE_ENABLE=NO
                          -DCMAKE_XCODE_ATTRIBUTE_CLANG_ENABLE_MODULES=NO
                          -DCMAKE_XCODE_ATTRIBUTE_CLANG_ENABLE_EXPLICIT_MODULES=NO )
          else
            echo "::warning::ccache is not available; compiling without it."
          fi
          cmake -S "${{ github.workspace }}/target/macos" \
            -B "${BUILD_DIR}" \
            -G Xcode \
            -DCMAKE_PREFIX_PATH="${{ steps.deps.outputs.prefix-dir }}" \
            -DLEAFLET_MAPS_KEY="${LEAFLET_KEY}" \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            ${CCACHE_ARGS[@]+"${CCACHE_ARGS[@]}"}

      - name: Build InterSpec.app
        run: |
          cmake --build "${BUILD_DIR}" --config Release
          echo "APP_BUNDLE=${BUILD_DIR}/Release/InterSpec.app" >> "${GITHUB_ENV}"

      # Hit rate, and why anything was not cacheable ("unsupported compiler option", ...).
      - name: ccache statistics
        if: always()
        run: ccache --show-stats --verbose || true

      - name: Copy D3 resources
        run: |
          set -euo pipefail
          D3_SOURCE="${{ github.workspace }}/external_libs/SpecUtils/d3_resources"
          D3_DEST="${APP_BUNDLE}/Contents/Resources/InterSpec_resources"
          echo "Copying D3 resources from ${D3_SOURCE} to ${D3_DEST}"
          cp "${D3_SOURCE}/d3.v3.min.js" "${D3_DEST}/"
          cp "${D3_SOURCE}/SpectrumChartD3.js" "${D3_DEST}/"
          cp "${D3_SOURCE}/SpectrumChartD3.css" "${D3_DEST}/"
          ls -lh "${D3_DEST}/"

      - name: Codesign bundle
        env:
          MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          
          # Sign the QuickLook plugin first (it's a nested bundle)
          QUICKLOOK_PLUGIN="${APP_BUNDLE}/Contents/Library/QuickLook/SpecFilePreview.qlgenerator"
          if [ -d "${QUICKLOOK_PLUGIN}" ]; then
            echo "Signing QuickLook plugin..."
            codesign --force --options runtime --timestamp \
              --sign "${MAC_SIGNING_IDENTITY}" \
              "${QUICKLOOK_PLUGIN}/Contents/MacOS/SpecFilePreview"
            codesign --force --options runtime --timestamp \
              --sign "${MAC_SIGNING_IDENTITY}" \
              "${QUICKLOOK_PLUGIN}"
          fi

          # Sign Quick Look appex extensions (nested bundles in Contents/PlugIns/)
          APPEX_ENTITLEMENTS="${{ github.workspace }}/target/macos/quicklook/SpecFilePreviewExtension/SpecFilePreview.entitlements"
          if [ -d "${APP_BUNDLE}/Contents/PlugIns" ]; then
            echo "Signing appex extensions..."
            find "${APP_BUNDLE}/Contents/PlugIns" -type d -name "*.appex" | while read -r appex; do
              APPEX_NAME=$(basename "${appex}" .appex)
              echo "  Signing appex executable: ${APPEX_NAME}"
              codesign --force --options runtime --timestamp \
                --entitlements "${APPEX_ENTITLEMENTS}" \
                --sign "${MAC_SIGNING_IDENTITY}" \
                "${appex}/Contents/MacOS/${APPEX_NAME}"
              echo "  Signing appex bundle: ${appex}"
              codesign --force --options runtime --timestamp \
                --entitlements "${APPEX_ENTITLEMENTS}" \
                --sign "${MAC_SIGNING_IDENTITY}" \
                "${appex}"
            done
          fi
          
          # Sign any frameworks in the bundle
          if [ -d "${APP_BUNDLE}/Contents/Frameworks" ]; then
            echo "Signing frameworks..."
            # Sign .dylib files first
            find "${APP_BUNDLE}/Contents/Frameworks" -type f -name "*.dylib" | while read -r dylib; do
              echo "  Signing dylib: ${dylib}"
              codesign --force --options runtime --timestamp \
                --sign "${MAC_SIGNING_IDENTITY}" \
                "${dylib}" || true
            done
            # Then sign framework bundles (these are directories)
            find "${APP_BUNDLE}/Contents/Frameworks" -type d -name "*.framework" | while read -r framework; do
              echo "  Signing framework: ${framework}"
              codesign --force --options runtime --timestamp \
                --sign "${MAC_SIGNING_IDENTITY}" \
                "${framework}"
            done
          fi
          
          # Sign all executables in Contents/MacOS (except the main one, which we'll sign with entitlements)
          if [ -d "${APP_BUNDLE}/Contents/MacOS" ]; then
            echo "Signing additional executables in MacOS directory..."
            find "${APP_BUNDLE}/Contents/MacOS" -type f -perm +111 ! -name "InterSpec" | while read -r executable; do
              echo "  Signing: ${executable}"
              codesign --force --options runtime --timestamp \
                --sign "${MAC_SIGNING_IDENTITY}" \
                "${executable}"
            done
          fi
          
          # Sign the main app bundle (without --deep since we signed nested components)
          echo "Signing main app bundle..."
          codesign --force --options runtime --timestamp \
            --entitlements "${{ github.workspace }}/target/macos/InterSpec.entitlements" \
            --sign "${MAC_SIGNING_IDENTITY}" \
            "${APP_BUNDLE}"
          
          # Verify the signature
          codesign --verify --deep --strict --verbose=2 "${APP_BUNDLE}"

      - name: Zip bundle for notarization
        run: |
          set -euo pipefail
          NOTARIZE_ARCHIVE="${INSTALLER_DIR}/InterSpec_notarize.zip"
          ditto -c -k --keepParent "${APP_BUNDLE}" "${NOTARIZE_ARCHIVE}"
          echo "NOTARIZE_ARCHIVE=${NOTARIZE_ARCHIVE}" >> "${GITHUB_ENV}"

      - name: Notarize bundle
        uses: ./.github/actions/macos_notarize
        with:
          archive: ${{ env.NOTARIZE_ARCHIVE }}
          staple-path: ${{ env.APP_BUNDLE }}
          key-id: ${{ secrets.MAC_NOTARY_KEY_ID }}
          key-issuer: ${{ secrets.MAC_NOTARY_KEY_ISSUER }}
          team-id: ${{ secrets.MAC_NOTARY_TEAM_ID }}

      - name: Remove the notarization zip
        run: rm -f "${NOTARIZE_ARCHIVE}"

      - name: Prepare distribution payload
        run: |
          set -euo pipefail
          rm -rf "${PAYLOAD_DIR}"
          mkdir -p "${PAYLOAD_DIR}"
          cp -R "${APP_BUNDLE}" "${PAYLOAD_DIR}/"
          cp "${{ github.workspace }}/LICENSE.txt" "${PAYLOAD_DIR}/"
          cp "${{ github.workspace }}/NOTICE.html" "${PAYLOAD_DIR}/"
          {
            echo "This is an automated build of InterSpec built on the github infrastructure at $(date)"
            echo ""
            echo "No testing has been performed on this build."
            echo ""
            echo "InterSpec code git hash SHA: ${{ github.sha }}"
            echo ""
            echo "Contact InterSpec@sandia.gov for support"
          } > "${PAYLOAD_DIR}/build_info.txt"

      - name: Create DMG installer
        env:
          MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          BUILD_DATE=$(date +%Y-%m-%d)
          # One name drives both the file and the mounted volume, so the warning cannot survive
          # in the filename but get lost the moment someone opens the image.  Including the date
          # also means two different builds can be mounted at once without macOS disambiguating
          # the second to "... 1".  (Verified this length is fine: hdiutil keeps volume names of
          # this size verbatim - the old 27-character HFS+ limit does not apply here.)
          DMG_NAME="InterSpec_macOS_Dangerously_Experimental_${BUILD_DATE}"
          DMG_PATH="${INSTALLER_DIR}/${DMG_NAME}.dmg"
          hdiutil create -volname "${DMG_NAME}" -srcfolder "${PAYLOAD_DIR}" -ov -format UDZO "${DMG_PATH}"
          codesign --force --options runtime --timestamp --sign "${MAC_SIGNING_IDENTITY}" "${DMG_PATH}"
          ls -lh "${INSTALLER_DIR}"
          echo "DMG_ARTIFACT=${DMG_PATH}" >> "${GITHUB_ENV}"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: ${{ env.DMG_ARTIFACT }}
          if-no-files-found: error

      - name: Cleanup keychain and credentials
        if: ${{ always() }}
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "${SIGNING_KEYCHAIN}" ]; then
            security delete-keychain "${SIGNING_KEYCHAIN}" || true
          fi
          if [ -n "${NOTARY_KEY_PATH:-}" ] && [ -f "${NOTARY_KEY_PATH}" ]; then
            rm -f "${NOTARY_KEY_PATH}" || true
          fi
