# ------------------------------------------------------------------------------------------------
# "Really Bleeding Edge" - automated builds of the `upgrade/Wt4` branch, which will become v1.1.
#
# These are deliberately kept separate from the master-branch "Development Build"
# (tag `bleeding-edge`, produced by build_app.yml): this branch is far less stable and carries
# many known issues, and the two should never be confused for one another.  Nothing in this file
# may touch the `bleeding-edge` tag or its release.
#
# On every push to the branch it builds, and publishes to the `wt4-bleeding-edge` release:
#   - the apps: the macOS .dmg (build_macos.yml), the Windows .zip (below), and the Linux .deb,
#     .rpm, AppImage and tarball (build_linux.yml);
#   - the stdio MCP server for all three (build_mcp_stdio.yml).
# The dependency prefixes are cached (.github/actions/{macos,linux}_deps_prefix and setup_dev_env),
# and so are the compiled objects (ccache/sccache), so a normal run is the time to compile what
# changed and to package and test, not an hour of rebuilding boost and Wt.
#
# NOTE ON WHERE THIS FILE LIVES: a copy is also committed to `master`, solely because GitHub only
#  registers `workflow_dispatch` for workflow files present on the default branch; without it there
#  is no "Run workflow" button, and `gh workflow run --ref upgrade/Wt4` returns 404.  It never fires
#  on master - the push trigger names only `upgrade/Wt4` - and a run uses the copy on the ref it
#  runs for, so the master copy's contents do not matter (and it is older than this one; do not
#  "sync" it, as it would then name workflows master does not have).
#
# WHEN `upgrade/Wt4` MERGES TO master: delete this file from both branches, and in build_app.yml:
#  call build_linux.yml (as it calls build_macos.yml) in place of its own build-linux job; give each
#  job that uses setup_dev_env (there and in test.yml) its own `cache_family`; and move the
#  prune-caches job below there, with its family list and `--ref` updated to match.
# ------------------------------------------------------------------------------------------------
name: Really Bleeding Edge (Wt4)

on:
  push:
    branches:
      - upgrade/Wt4
  workflow_dispatch:

permissions:
  contents: read

env:
  # The name is the warning.  This is what the user sees after unzipping, so it says what the
  # build is rather than which branch it came from - "Wt4" means nothing to someone downloading
  # it.  Referenced by every step of the windows-build job.
  INSTALL_DIR_NAME: InterSpec_Win32_Dangerously_Experimental

concurrency:
  # Must not collide with the group used by any workflow this one calls (build_macos.yml uses
  # `ci-macos-<ref>`).  Concurrency groups are repo-global across workflows, so a caller sharing a
  # group with its callee deadlocks: the caller holds the group while the callee waits for it.
  group: wt4-edge-${{ github.ref }}
  # A cancelled job never reaches its `cache/save` step, which would throw away an hours-long
  # dependency build.  Queue behind the running job instead of pre-empting it.
  cancel-in-progress: false

jobs:
  # The "Run workflow" button's branch dropdown defaults to the DEFAULT branch, so the easiest
  # thing to do by accident is dispatch this against master.  That checks out master, which has
  # neither .github/actions/macos_deps_prefix nor the updated setup_dev_env, and the run dies
  # with three unrelated-looking errors that say nothing about the actual mistake.  Fail fast
  # instead, on a cheap runner, before a scarce macOS runner is even allocated.
  guard:
    name: Check branch
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run against anything but upgrade/Wt4
        if: github.ref != 'refs/heads/upgrade/Wt4'
        shell: bash
        run: |
          echo "::error::This workflow builds the upgrade/Wt4 branch, but was dispatched against"
          echo "::error::'${{ github.ref }}'.  The copy of this file on master exists only so that"
          echo "::error::GitHub registers the 'Run workflow' button - workflow_dispatch is only"
          echo "::error::offered for workflows present on the default branch.  Press 'Run workflow'"
          echo "::error::again and pick upgrade/Wt4 in the branch dropdown."
          exit 1

  # Builds the dependency prefix (via .github/actions/macos_deps_prefix, so the cache key matches
  # what a deps-only run produced) and then the signed, notarized .app and .dmg.  This replaces
  # the phase-1 `macos-deps` job rather than sitting alongside it: two jobs building the same
  # prefix would, on any cache-key change, build it from scratch twice in parallel.
  macos-build:
    name: macOS app
    needs: guard
    uses: ./.github/workflows/build_macos.yml
    # The called workflow declares 8 required secrets (signing cert, notary key, Leaflet key).
    # `inherit` satisfies them for a same-repo call.
    secrets: inherit

  windows-build:
    name: Windows app
    needs: guard
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: true

      # Builds or restores the dependency prefix, and sets up MSVC 2022, CMake and sccache.
      - name: Set up dev env and dependency prefix
        uses: ./.github/actions/setup_dev_env
        with:
          cache_family: wt4-win-app

      # Fails fast if the curated SBOM component list has drifted from the pinned dependency
      # versions in target/dep_build/dep_build_msvc2022.bat, or from a submodule/vendored path.
      - name: Validate SBOM component list
        shell: pwsh
        run: python "${{ github.workspace }}/target/wxwidgets/sbom/make_sbom.py" --check --repo "${{ github.workspace }}"

      # Deliberately NOT cached, unlike build_app.yml's `Cache wxWidgets config/build`.  That is
      # a build-DIRECTORY cache, and this repo already measured the result: actions/checkout
      # rewrites every source file's mtime, so a warm build-dir cache compiles exactly as many
      # objects as a cold one (see the comments on the build-linux job in build_app.yml).  A
      # from-scratch configure costs a minute or two; sccache is what actually saves compile time.
      - name: Configure
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          LEAFLET_KEY: ${{ secrets.LEAFLET_KEY }}
        run: |
          $prefix = "${{ runner.temp }}/install"
          if (-Not (Test-Path 'build_wt4_wx_app')) { mkdir build_wt4_wx_app }
          cd build_wt4_wx_app
          # sccache is an optimization only (setup_dev_env carries on without it).
          $launcher = @()
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            $launcher = @("-DCMAKE_C_COMPILER_LAUNCHER=sccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache")
          } else {
            Write-Output "::warning::sccache is not available; compiling without it."
          }
          cmake -DInterSpec_FETCH_DEPENDENCIES=OFF -DUSE_LEAFLET_MAP=ON -DLEAFLET_MAPS_KEY="$env:LEAFLET_KEY" -DUSE_REMOTE_RID=ON -DUSE_REL_ACT_TOOL=ON -DUSE_DETECTION_LIMIT_TOOL=ON -DUSE_LLM_INTERFACE=ON -DCMAKE_INSTALL_PREFIX="$env:INSTALL_DIR_NAME" -DCMAKE_PREFIX_PATH="$prefix" -DNO_CMAKE_SYSTEM_PATH=ON -DCMAKE_FIND_USE_CMAKE_SYSTEM_PATH=OFF @launcher -DwxWidgets_ROOT_DIR="$prefix" -DwxWidgets_LIB_DIR="$prefix/lib/vc_x64_lib" -DwxWidgets_CONFIGURATION="msw" -DCMAKE_BUILD_TYPE="Release" -DCMAKE_CONFIGURATION_TYPES="Release" -G "Ninja" "${{ github.workspace }}/target/wxwidgets"

      - name: Build and package
        shell: pwsh
        working-directory: ${{ runner.temp }}/build_wt4_wx_app
        run: |
          $install_dir = "$env:INSTALL_DIR_NAME"
          if (Test-Path $install_dir) { Remove-Item $install_dir -Recurse -Force }
          cmake --build . --config Release
          cmake --build . --config Release --target install

          $notes = "$install_dir\build_info.txt"
          echo "This is an automated build of the InterSpec upgrade/Wt4 branch, built on the GitHub infrastructure at $(Get-Date -AsUTC -Format o)" >> $notes
          echo "" >> $notes
          echo "This branch is EXTRA UNSTABLE and has many known issues.  No testing has been performed on this build." >> $notes
          echo "" >> $notes
          echo "InterSpec code git has SHA: ${{ github.sha }}" >> $notes
          echo "The Edge browser runtime is required to run; this will typically already be installed on Windows 10 and 11." >> $notes

          # CycloneDX SBOM into the install dir, so it ships inside the .zip.
          python "${{ github.workspace }}/target/wxwidgets/sbom/make_sbom.py" `
            --repo "${{ github.workspace }}" `
            --git-sha "${{ github.sha }}" `
            --timestamp "$(Get-Date -AsUTC -Format o)" `
            --output "$install_dir/InterSpec_sbom.cdx.json"

          Get-ChildItem "$install_dir*.zip" -ErrorAction SilentlyContinue | ForEach-Object { Remove-Item -Path $_.FullName }
          Compress-Archive -CompressionLevel Optimal -Path ".\$install_dir" -DestinationPath "$($install_dir)_$(Get-Date -f yyyy-MM-dd).zip"
          Get-ChildItem

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          overwrite: true
          if-no-files-found: error
          path: '${{ runner.temp }}/build_wt4_wx_app/${{ env.INSTALL_DIR_NAME }}_*.zip'

      # Catches the "it linked but cannot start" class of failure - missing resources, a bad
      # working directory, an unloadable Wt config - which a compile-only check would miss.
      - name: Test app build worked
        shell: pwsh
        working-directory: ${{ runner.temp }}/build_wt4_wx_app/${{ env.INSTALL_DIR_NAME }}
        run: |
          $p = Start-Process .\InterSpec.exe -ArgumentList @("--test-load", "--mult-instance", "--no-restore") -PassThru
          $errTimedOut = $null
          $p | Wait-Process -Timeout 120 -ErrorAction SilentlyContinue -ErrorVariable errTimedOut
          if ($errTimedOut) { Stop-Process -InputObject $p -Force }
          echo "Exit code of InterSpec test load was $($p.ExitCode)"
          exit $p.ExitCode

  linux-build:
    name: Linux app
    needs: guard
    uses: ./.github/workflows/build_linux.yml
    # For LEAFLET_KEY, which the called workflow declares required.
    secrets: inherit

  mcp-stdio:
    name: stdio MCP server
    needs: guard
    uses: ./.github/workflows/build_mcp_stdio.yml
    # For the macOS signing and notarization secrets.
    secrets: inherit

  # Publishes whatever built, as long as all three apps did: a stdio MCP server failure leaves the
  # run red, but does not hold back the apps.  An asset is only replaced by a new one of the same
  # kind, so a platform that failed keeps its previous (dated) build on the release.
  release:
    name: Publish
    needs: [guard, macos-build, windows-build, linux-build, mcp-stdio]
    if: >-
      ${{ !cancelled() && needs.guard.result == 'success'
          && needs.macos-build.result == 'success'
          && needs.windows-build.result == 'success'
          && needs.linux-build.result == 'success' }}
    runs-on: ubuntu-latest
    # `contents: write` ONLY on this job.  The workflow-level default above stays `read`, so the
    # build jobs - including the reusable build_macos.yml call - never get a writable token.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: wt4-bleeding-edge
      # Both platforms' assets carry this, which is the only reason one pattern can match both.
      # Keep it in step with INSTALL_DIR_NAME above and the .dmg name in build_macos.yml.
      ASSET_PATTERN: 'InterSpec_*Dangerously_Experimental*'
    steps:
      # EndBug/latest-tag below runs git commands against the workspace, so this job needs a
      # checkout even though it builds nothing.  (build_app.yml gets away without one in its
      # release job only because its latest-tag step lives in a build job instead.)
      # No submodules: tagging does not need them, and they are most of the clone time.
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-build'
          path: ./artifacts
          merge-multiple: true

      - name: Show what will be published
        run: ls -lhR ./artifacts

      # Asset names carry a build date, so every run produces NEW asset names rather than
      # overwriting the previous ones; without this the release would gain stale assets every single
      # day.  An old asset is deleted only when this run produced one of the same kind - the same
      # name but for the date - so a build that failed leaves its predecessor in place rather than
      # a gap.  (build_app.yml's equivalent uses PATTERN="InterSpec_app*", which does not match
      # these names - do not copy that pattern here.)
      - name: Delete the previous run's assets
        run: |
          set -euo pipefail
          # An asset's kind: its name without the _YYYY-MM-DD date.
          kind() { printf '%s\n' "$1" | sed -E 's/_[0-9]{4}-[0-9]{2}-[0-9]{2}([._])/\1/'; }
          NEW_KINDS=$(find ./artifacts -type f -printf '%f\n' | while read -r f; do kind "${f}"; done | sort -u)
          echo "This run produced:"; printf '  %s\n' ${NEW_KINDS}

          # Look the release up by tag, not by name: the tag is the stable identifier, and a
          # release whose name someone edited in the UI would otherwise go unmatched.
          RELEASE_ID=$(curl -sS -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" \
            | jq -r '.id // empty')

          # First run, or the release was deleted: nothing to clean up, and the publish step
          # below creates it fresh.
          if [ -z "${RELEASE_ID}" ]; then
            echo "No existing '${RELEASE_TAG}' release; nothing to prune."
            exit 0
          fi

          curl -sS -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
            | jq -c '.[]?' | while read -r asset; do
              NAME=$(echo "${asset}" | jq -r '.name')
              ID=$(echo "${asset}" | jq -r '.id')
              case "${NAME}" in
                ${ASSET_PATTERN})
                  # A here-string, not `printf | grep -q`: grep -q exits at its first match, and the
                  #  SIGPIPE that can give printf would read as "no match" under pipefail.
                  if grep -qxF "$(kind "${NAME}")" <<< "${NEW_KINDS}"; then
                    echo "Deleting stale asset: ${NAME}"
                    curl -sS -X DELETE -H "Authorization: token ${GH_TOKEN}" \
                      "https://api.github.com/repos/${{ github.repository }}/releases/assets/${ID}"
                  else
                    echo "Keeping (no new build of this kind): ${NAME}"
                  fi
                  ;;
                *) echo "Keeping: ${NAME}" ;;
              esac
            done

      # softprops/action-gh-release creates a missing tag, but never MOVES an existing one - so
      # without this the tag would stay pinned to the first commit ever released.  It has to run
      # before the publish step, and in this job rather than in a parallel build job (which is
      # what build_app.yml does, racing the tag move against the release creation).
      - name: Point the tag at this commit
        uses: EndBug/latest-tag@v1.6.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          description: Latest automated build of the upgrade/Wt4 branch

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Really Bleeding Edge (v1.1 preview)"
          draft: false
          generate_release_notes: false
          prerelease: true
          # A prerelease can never be the repo's "Latest release", and asking for it is invalid.
          make_latest: false
          fail_on_unmatched_files: true
          files: "./artifacts/**"
          body: |
            ## Expect this to be broken

            These are automated builds of the `upgrade/Wt4` development branch. It is **far less
            stable than anything else published here** and has many known issues. It is what will
            eventually become v1.1, but it is not that yet, and no testing whatsoever has been
            performed on these builds.

            If you want a build that is merely *untested* rather than actively broken, use the
            [Development Build](https://github.com/sandialabs/InterSpec/releases/tag/bleeding-edge)
            instead. If you want something dependable, use the latest stable release.

            Please do not use these builds for any analysis you care about.

            | Asset | Notes |
            | --- | --- |
            | `InterSpec_macOS_Dangerously_Experimental_<date>.dmg` | Requires macOS 13.3 (Ventura) or later. Universal (Intel + Apple silicon), signed and notarized. |
            | `InterSpec_Win32_Dangerously_Experimental_<date>.zip` | 64-bit. Requires Windows 10 or 11, and the Edge browser runtime (normally already installed). Unzip and run `InterSpec.exe`. |
            | `InterSpec_Linux_x64_Dangerously_Experimental_<date>.deb` / `.rpm` / `.AppImage` / `.tar.gz` | x86_64, glibc 2.28 or later (RHEL 8, Debian 10, Ubuntu 20.04, Fedora 29, or newer). |

            ### The stdio MCP server

            `InterSpec-mcp-stdio` lets an MCP client - Claude Code, Claude Desktop, and others - use
            InterSpec's analysis tools: loading spectra, fitting peaks, identifying sources, activity and
            shielding fits, isotopics, and so on. It runs with no window, launched by the client.
            Unpack the archive anywhere and follow `InterSpec-mcp-stdio/share/interspec/README.md`.

            | Asset | Notes |
            | --- | --- |
            | `InterSpec_MCP_stdio_macOS_arm64_Dangerously_Experimental_<date>.zip` | Apple silicon, macOS 13.3 or later. Signed and notarized. |
            | `InterSpec_MCP_stdio_Win64_Dangerously_Experimental_<date>.zip` | 64-bit Windows 10 or 11. Not code-signed. |
            | `InterSpec_MCP_stdio_Linux_x64_Dangerously_Experimental_<date>.tar.gz` | x86_64, glibc 2.28 or later. |

            If one platform's build failed, its asset is the previous one - check the date in its name.
            Each archive contains a `build_info.txt` recording the exact commit it was built from.

  # Each compiler-cache family (see the `ccache`/`sccache` steps and the Linux `Restore ccache`
  # steps) saves a new, timestamped entry every run, and restores the newest.  Delete the rest, so
  # this branch's churn never pushes anything else - master's caches especially, which are used less
  # often - out of the repository's 10 GB cache budget.  Its own job so that no build job, where
  # third-party actions run, holds a token that can delete caches.  Best effort: never fails a run.
  prune-caches:
    name: Prune superseded compiler caches
    needs: [guard, macos-build, windows-build, linux-build, mcp-stdio]
    if: ${{ always() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Keep only the newest entry of each family
        shell: bash
        run: |
          set -uo pipefail
          # The keys as stored: ccache-action prefixes its `key` with the variant (`ccache-` or
          # `sccache-`).  No family may be a string prefix of another.
          for family in ccache-wt4-macos-app- ccache-wt4-macos-stdio- \
                        sccache-wt4-win-app- sccache-wt4-win-stdio- \
                        linux-ccache-wt4-app- linux-ccache-wt4-stdio- ; do
            ids=$(gh cache list -R "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF}" --key "${family}" \
                    --sort created_at --order desc --limit 100 --json id,key --jq '.[] | "\(.id) \(.key)"')
            first=1
            while read -r id key; do
              [ -z "${id}" ] && continue
              if [ "${first}" = 1 ]; then
                echo "keep:   ${key}"
                first=0
              else
                echo "delete: ${key}"
                gh cache delete "${id}" -R "${GITHUB_REPOSITORY}" || echo "  (could not delete ${id})"
              fi
            done <<< "${ids}"
          done

# ------------------------------------------------------------------------------------------------
# Unrelated wart worth fixing sometime, but not here: git contains BOTH `target/wxWidgets/sbom/`
# and `target/wxwidgets/`.  It only works because Windows and macOS checkouts are case-insensitive
# and collapse them into one directory; on a case-sensitive Linux checkout they are two.
# ------------------------------------------------------------------------------------------------
