name: macOS signing setup
description: >
  Imports the Developer ID Application certificate into a temporary keychain, and writes the App Store
  Connect API key notarytool uses, for the rest of the job.

# ------------------------------------------------------------------------------------------------
# Shared by build_macos.yml (the app) and build_mcp_stdio.yml (the stdio MCP server), so the two sign
# the same way.  Secrets come in as inputs and reach the scripts only through `env:`.
#
# Sets SIGNING_KEYCHAIN, KEYCHAIN_PASSWORD and NOTARY_KEY_PATH in the job environment (also given as
# outputs).  A composite action has no post step, so the CALLING JOB must clean up with an
# `if: always()` step that deletes ${SIGNING_KEYCHAIN} and removes ${NOTARY_KEY_PATH}.
# ------------------------------------------------------------------------------------------------

inputs:
  signing-cert-p12:
    description: Base64 of the Developer ID Application certificate and key (.p12).
    required: true
  signing-cert-password:
    description: Password of the .p12.
    required: true
  notary-key-contents:
    description: Base64 of the App Store Connect API key (.p8) notarytool authenticates with.
    required: true

outputs:
  keychain-path:
    description: The temporary keychain holding the signing identity.
    value: ${{ steps.keychain.outputs.keychain-path }}
  notary-key-path:
    description: Path of the decoded .p8 key.
    value: ${{ steps.notary.outputs.notary-key-path }}

runs:
  using: composite
  steps:
    - name: Import signing certificate
      id: keychain
      shell: bash
      env:
        MAC_SIGNING_CERT_P12: ${{ inputs.signing-cert-p12 }}
        MAC_SIGNING_CERT_PASSWORD: ${{ inputs.signing-cert-password }}
      run: |
        set -euo pipefail
        CERT_PATH="${RUNNER_TEMP}/signing_cert.p12"
        echo "${MAC_SIGNING_CERT_P12}" | base64 --decode > "${CERT_PATH}"
        KEYCHAIN_PATH="${RUNNER_TEMP}/interspec-build.keychain-db"
        KEYCHAIN_PASSWORD=$(uuidgen)
        security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
        security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
        security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
        security import "${CERT_PATH}" -k "${KEYCHAIN_PATH}" -P "${MAC_SIGNING_CERT_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
        security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
        security list-keychains -d user -s "${KEYCHAIN_PATH}" ~/Library/Keychains/login.keychain-db
        rm -f "${CERT_PATH}"
        echo "::add-mask::${KEYCHAIN_PASSWORD}"
        echo "SIGNING_KEYCHAIN=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"
        echo "KEYCHAIN_PASSWORD=${KEYCHAIN_PASSWORD}" >> "${GITHUB_ENV}"
        echo "keychain-path=${KEYCHAIN_PATH}" >> "${GITHUB_OUTPUT}"

    - name: Prepare notarization credentials
      id: notary
      shell: bash
      env:
        MAC_NOTARY_KEY_CONTENTS: ${{ inputs.notary-key-contents }}
      run: |
        set -euo pipefail
        NOTARY_KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
        echo "${MAC_NOTARY_KEY_CONTENTS}" | base64 --decode > "${NOTARY_KEY_PATH}"
        echo "NOTARY_KEY_PATH=${NOTARY_KEY_PATH}" >> "${GITHUB_ENV}"
        echo "notary-key-path=${NOTARY_KEY_PATH}" >> "${GITHUB_OUTPUT}"
