<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CeeLo Geometry Viewer - Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1f;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
    overflow: hidden;
    height: 100vh;
  }
  #controls {
    padding: 10px 16px;
    background: #222228;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    gap: 16px;
    height: 48px;
  }
  #controls label { font-size: 14px; color: #aaa; }
  #configSelect {
    padding: 5px 10px;
    background: #333;
    color: #e0e0e0;
    border: 1px solid #555;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
  }
  #configDesc {
    font-size: 13px;
    color: #888;
    flex: 1;
  }
  #resetBtn {
    padding: 5px 14px;
    background: #444;
    color: #ccc;
    border: 1px solid #555;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  #resetBtn:hover { background: #555; }
  #viewer {
    width: 100%;
    height: calc(100vh - 48px);
  }
</style>
</head>
<body>

<div id="controls">
  <label for="configSelect">Configuration:</label>
  <select id="configSelect"></select>
  <span id="configDesc"></span>
  <button id="resetBtn" onclick="viewer.resetCamera()">Reset View</button>
</div>
<div id="viewer"></div>

var viewer = new GeometryViewer3D(document.getElementById('viewer'), {
  showAxes: true
});

var select = document.getElementById('configSelect');
var descEl = document.getElementById('configDesc');

Object.keys(CONFIGS).forEach(function(key) {
  var opt = document.createElement('option');
  opt.value = key;
  opt.textContent = CONFIGS[key].label;
  select.appendChild(opt);
});

function loadConfig(key) {
  var cfg = CONFIGS[key];
  if (!cfg) return;
  // Set source before loading GDML so camera framing includes source position
  if (cfg.source) {
    viewer.sourcePosition = cfg.source.slice();
  } else {
    viewer.sourcePosition = null;
  }
  viewer.loadGDML(cfg.gdml);
  if (cfg.source) {
    viewer.setSourcePosition(cfg.source[0], cfg.source[1], cfg.source[2]);
  } else {
    viewer.setSourcePosition(null);
  }
  descEl.textContent = cfg.label;
}

select.addEventListener('change', function() {
  loadConfig(this.value);
});

// Load first config
loadConfig(select.value);
